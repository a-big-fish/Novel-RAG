<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔阵 · 范本观察台</title>
<style>
  :root{--paper:#f7f6f2;--white:#fcfbf8;--ink:#25231f;--quiet:#777168;--line:#ded9cf;--red:#ab432f;--green:#557459;--serif:"Noto Serif SC","Source Han Serif SC",SimSun,serif;--sans:"Microsoft YaHei","Segoe UI",sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 var(--sans)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  header{border-bottom:1px solid var(--line);background:var(--white)}.head{max-width:1440px;margin:auto;padding:22px 36px;display:flex;align-items:end;gap:28px}.mark{width:38px;height:38px;background:var(--red);color:white;display:grid;place-items:center;font:25px var(--serif);border-radius:3px}.brand{font:700 24px var(--serif);letter-spacing:.08em}.subtitle{color:var(--quiet);font-size:13px;margin-top:1px}.selectors{margin-left:auto;display:flex;align-items:end;gap:12px}.field{display:grid;gap:4px;color:var(--quiet);font-size:12px}.field select{min-width:140px;border:1px solid var(--line);background:white;padding:7px 30px 7px 10px;color:var(--ink)}
  main{max-width:1440px;margin:auto;padding:0 36px 70px}.nav{display:flex;gap:28px;border-bottom:1px solid var(--line)}.nav button{padding:16px 0 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--quiet)}.nav button.active{color:var(--red);border-color:var(--red);font-weight:700}.status{min-height:34px;color:var(--quiet);font-size:13px;padding:9px 0}.status.error{color:var(--red)}h1{font:700 clamp(24px,3vw,36px) var(--serif);margin:20px 0 6px}h2{font:700 19px var(--serif);margin:0}.lead{color:var(--quiet);margin:0 0 22px}.summary{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);margin:18px 0 26px}.metric{padding:15px 18px;background:var(--white);border-right:1px solid var(--line)}.metric:last-child{border:0}.metric b{display:block;font:700 25px var(--serif)}.metric span{font-size:12px;color:var(--quiet)}
  .work{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;border:1px solid var(--line);background:var(--white);min-height:530px}.panel{padding:18px;min-width:0}.panel+.panel{border-left:1px solid var(--line)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.small{font-size:12px;color:var(--quiet)}.scene-list{max-height:600px;overflow:auto}.scene{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 5px}.scene:hover,.scene.active{background:#f2eee8}.scene strong{display:block;font:700 15px var(--serif)}.scene small{color:var(--quiet)}.pill{display:inline-block;color:var(--green);font-size:11px;border:1px solid #b9c7b8;border-radius:20px;padding:0 7px;margin-left:7px}.pill.archived{color:var(--quiet);border-color:var(--line)}.pill.failed{color:var(--red);border-color:#d7a69b}.controls{display:flex;align-items:center;gap:8px;margin:12px 0}.controls button,.plain{border:1px solid var(--line);background:white;padding:5px 10px}.controls button:disabled{opacity:.4;cursor:default}.scene-text{font:16px/2.05 var(--serif);white-space:pre-wrap;max-width:68ch}.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.detail-meta b{display:block;font-size:12px;color:var(--red);font-weight:500}.detail-meta span{font-size:14px}.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin:3px 4px 3px 0;font-size:12px}.side-block{margin-bottom:24px}.side-block h3{font:700 15px var(--serif);margin:0 0 9px}.side-block p{margin:4px 0;color:var(--quiet);font-size:13px}.tally{display:grid;gap:6px}.tally div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px}.tally span:last-child{color:var(--quiet)}.plot{margin-top:26px;border:1px solid var(--line);background:#292722;color:#eee;padding:20px}.plot h2{color:#fff}.plot-head{display:flex;justify-content:space-between;gap:15px}.plot select{background:#292722;color:white;border:1px solid #6d675d;padding:5px}.plot svg{width:100%;height:300px;margin-top:12px}.plot circle{cursor:pointer}.plot circle:hover{stroke:#fff;stroke-width:3}
  .search-form{display:flex;gap:10px;margin:18px 0 8px}.search-form textarea{flex:1;min-height:82px;resize:vertical;border:1px solid var(--line);background:var(--white);padding:12px}.primary{background:var(--red);color:white;border:0;padding:0 28px;font-weight:700}.query-note{font-size:13px;color:var(--quiet);margin:14px 0 20px}.query-note b{color:var(--ink)}.routes{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto}.route{background:var(--white);border:1px solid var(--line);min-width:170px}.route h2{font:700 15px var(--serif);padding:14px;border-bottom:1px solid var(--line)}.route h2 span{display:block;color:var(--quiet);font:11px var(--sans)}.hit{display:block;background:none;border:0;border-bottom:1px solid var(--line);padding:12px;width:100%;text-align:left}.hit:hover{background:#f1ede6}.hit b{font:700 14px var(--serif)}.hit small{display:block;color:var(--quiet);margin-top:4px}.empty{padding:16px;color:var(--quiet);font-size:13px}.result-detail{margin-top:22px;border:1px solid var(--line);padding:20px;background:var(--white)}.hidden{display:none!important}
  @media(max-width:1080px){.work{grid-template-columns:240px minmax(0,1fr)}.work .panel:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}@media(max-width:720px){.head{padding:16px;flex-wrap:wrap;gap:8px}.selectors{width:100%;margin-left:0}.selectors .field{flex:1}.field select{width:100%;min-width:0}main{padding:0 16px 50px}.summary{grid-template-columns:repeat(2,1fr)}.metric{border-bottom:1px solid var(--line)}.work{display:block}.panel+.panel{border-left:0;border-top:1px solid var(--line)}.search-form{display:block}.search-form textarea{width:100%}.primary{padding:10px 20px;margin-top:8px}.routes{grid-template-columns:repeat(5,190px)}}
</style>
</head>
<body>
<header><div class="head"><div class="mark">笔</div><div><div class="brand">笔阵 · 范本观察台</div><div class="subtitle">从场景入库到检索命中，逐条看见依据</div></div><div class="selectors"><label class="field">书籍<select id="book"></select></label><label class="field">索引版本<select id="version"></select></label></div></div></header>
<main><nav class="nav"><button id="tab-observe" class="active">索引观察</button><button id="tab-search">检索实验</button></nav><div id="status" class="status" role="status"></div>
<section id="observe"><h1 id="book-title">选择一本书</h1><p class="lead">查看入选场景、归档场景与索引是否一致。</p><div id="summary" class="summary"></div><div class="work"><section class="panel"><div class="panel-head"><h2>场景目录</h2><select id="filter" aria-label="筛选场景"><option value="">全部</option><option value="selected">入选</option><option value="archived">归档</option><option value="evaluation_failed">评估失败</option></select></div><div id="scene-list" class="scene-list"></div><div class="controls"><button id="prev">上一页</button><span id="page" class="small"></span><button id="next">下一页</button></div></section><section class="panel"><div class="panel-head"><h2 id="scene-title">选择一个场景</h2><span id="scene-position" class="small"></span></div><div id="scene-detail" class="small">左侧选定场景后，在这里阅读原文及标注。</div></section><aside class="panel"><div class="side-block"><h3>标签分布</h3><div id="tags" class="tally"></div></div><div class="side-block"><h3>相近场景</h3><div id="similar" class="tally small">选择入选场景后显示</div></div><div class="side-block"><h3>版本对照</h3><div id="compare" class="small">选择另一版本后显示</div></div><div class="side-block"><h3>最近索引阶段</h3><div id="jobs" class="tally small"></div></div></aside></div><div class="plot"><div class="plot-head"><div><h2>向量星图</h2><div class="small">同一书籍、同一版本内的二维投影；坐标不可跨版本比较</div></div><select id="vector"><option value="text-dense">原文向量</option><option value="meta-dense">风格向量</option><option value="summary-dense">摘要向量</option></select></div><svg id="sky" viewBox="0 0 900 300" role="img" aria-label="场景向量二维投影"></svg><div id="plot-note" class="small"></div></div></section>
<section id="search" class="hidden"><h1>检索实验</h1><p class="lead">输入写作需求，同时检查四路召回和融合结果。</p><form id="search-form" class="search-form"><textarea id="query" maxlength="2000" placeholder="例如：找一段通过对话逐步揭露真相、结尾有反转的场景" required></textarea><button class="primary" type="submit">检索范本</button></form><div id="query-note" class="query-note">结果只来自当前选定的书籍与版本。</div><div id="routes" class="routes"></div><div id="result-detail" class="result-detail hidden"></div></section>
</main>
<script>
const api='/api/v1'; const $=id=>document.getElementById(id);
const state={book:null,version:null,offset:0,total:0,selected:null,search:null};
const labels={text_dense:'原文语义',meta_dense:'风格与技法',summary_dense:'剧情摘要',text_sparse:'原文关键词',rrf:'融合排序'};
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);if(cls)el.className=cls;return el}
function clear(el){el.replaceChildren()}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
async function get(url,options){const response=await fetch(api+url,options);if(!response.ok){let body;try{body=await response.json()}catch{}throw Error(body?.detail||`请求失败 (${response.status})`)}return response.json()}
function scope(){return `/books/${state.book}/versions/${state.version}`}
function metric(label,value){const box=node('div',undefined,'metric');box.append(node('b',value),node('span',label));return box}
async function loadBooks(){try{const books=await get('/books');clear($('book'));books.forEach(book=>{const option=node('option',`${book.title} · #${book.id}`);option.value=book.id;$('book').append(option)});if(!books.length){status('尚无书籍。请先通过 API 登记并建立索引。');return}state.book=Number(books[0].id);await loadVersions()}catch(e){status(e.message,true)}}
async function loadVersions(){try{const data=await get(`/books/${state.book}/versions`);clear($('version'));data.versions.forEach(item=>{const option=node('option',`v${item.version}${item.version===data.current_version?' · 当前':''}`);option.value=item.version;$('version').append(option)});if(!data.versions.length){status('这本书尚未生成场景版本。');return}state.version=data.current_version||data.versions[0].version;$('version').value=state.version;state.offset=0;await loadObserve()}catch(e){status(e.message,true)}}
async function loadObserve(){if(!state.version)return;status('正在读取实时索引…');state.selected=null;$('filter').value='';$('scene-title').textContent='选择一个场景';$('scene-detail').textContent='左侧选定场景后，在这里阅读原文及标注。';$('similar').textContent='选择入选场景后显示';try{const [overview,page]=await Promise.all([get(scope()+'/overview'),get(scope()+'/scenes?limit=50&offset=0')]);$('book-title').textContent=overview.title;renderOverview(overview);renderPage(page);loadProjection();loadCompare();status(`书籍 #${state.book} · v${state.version} · 数据读取于 ${new Date(overview.generated_at).toLocaleString()}`)}catch(e){status(e.message,true)}}
function renderOverview(data){const c=data.counts;clear($('summary'));$('summary').append(metric('场景总数',c.total_scenes),metric('入选参考',c.selected),metric('归档场景',c.archived),metric('评估失败',c.evaluation_failed),metric('PG / Qdrant',`${data.indexed_selected} / ${data.qdrant_count??'—'}`));clear($('tags'));for(const [group,values] of Object.entries(data.tags)){for(const [tag,count] of Object.entries(values).slice(0,5)){const row=node('div');row.append(node('span',`${group} · ${tag}`),node('span',count));$('tags').append(row)}}if(!$('tags').children.length)$('tags').textContent='暂无标签';clear($('jobs'));data.recent_book_jobs.forEach(job=>{const row=node('div');row.append(node('span',job.stage),node('span',`${job.status} ${job.done_items}/${job.total_items}`));$('jobs').append(row)});if(!data.recent_book_jobs.length)$('jobs').textContent='尚无索引任务记录'}
async function loadCompare(){const other=[...$('version').options].map(o=>Number(o.value)).find(v=>v!==Number(state.version));if(!other){$('compare').textContent='只有一个版本';return}try{const data=await get(scope()+`/compare?other_version=${other}`);$('compare').textContent=`与 v${other} 比：相同原文 ${data.unchanged_text} · 新增 ${data.new_text} · 移除 ${data.removed_text} · 同文评估变化 ${data.reference_status_changed}。仅按完整场景原文精确匹配。`}catch(e){$('compare').textContent=e.message}}
async function loadScenes(){try{const filter=$('filter').value;const query=`?limit=50&offset=${state.offset}${filter?`&reference_status=${filter}`:''}`;renderPage(await get(scope()+'/scenes'+query))}catch(e){status(e.message,true)}}
function renderPage(data){state.total=data.total;clear($('scene-list'));data.items.forEach(item=>{const button=node('button',undefined,'scene');const title=node('strong',`场景 ${item.scene_index_in_book}`);const pill=node('span',item.reference_status,item.reference_status==='selected'?'pill':item.reference_status==='archived'?'pill archived':'pill failed');title.append(pill);button.append(title,node('small',`第 ${item.chapter_start_index} 章 · ${item.char_count} 字 · ${item.summary||'未标注'}`));button.onclick=()=>loadScene(item.id);$('scene-list').append(button)});if(!data.items.length)$('scene-list').append(node('p','当前筛选下没有场景。','empty'));$('page').textContent=`${data.total?state.offset+1:0}–${Math.min(state.offset+50,data.total)} / ${data.total}`;$('prev').disabled=state.offset===0;$('next').disabled=state.offset+50>=data.total}
async function loadScene(id,target='scene-detail'){try{const scene=await get(scope()+`/scenes/${id}`);state.selected=id;if(target==='scene-detail'){document.querySelectorAll('.scene').forEach(el=>el.classList.toggle('active',el.textContent.includes(`场景 ${scene.scene_index_in_book}`)));$('scene-title').textContent=`场景 ${scene.scene_index_in_book}`;$('scene-position').textContent=`第 ${scene.chapter_start_index}–${scene.chapter_end_index} 章`;clear($(target));const meta=node('div',undefined,'detail-meta');for(const [key,value] of [['参考价值',scene.reference_score],['评估结论',scene.reference_reason],['剧情摘要',scene.summary],['文风',scene.style_summary],['使用提示',scene.usage_hint]]){const box=node('div');box.append(node('b',key),node('span',value||'—'));meta.append(box)}$(target).append(meta,node('div',scene.text,'scene-text'));loadSimilar(id,scene.reference_status)}else{clear($(target));$(target).classList.remove('hidden');$(target).append(node('h2',`场景 ${scene.scene_index_in_book} · 原文`),node('p',scene.summary||'', 'small'),node('div',scene.text,'scene-text'))}}catch(e){status(e.message,true)}}
async function loadSimilar(id,referenceStatus){clear($('similar'));if(referenceStatus!=='selected'){$('similar').textContent='归档场景不参与向量检索';return}try{const data=await get(scope()+`/scenes/${id}/similar`);data.items.forEach(hit=>{const button=node('button',`场景 #${hit.scene_id} · ${hit.score.toFixed(3)}`,'scene');button.onclick=()=>loadScene(hit.scene_id);$('similar').append(button)});if(!data.items.length)$('similar').textContent='暂无相近场景'}catch{$('similar').textContent='相近场景暂不可用'}}
async function loadProjection(){try{const data=await get(scope()+`/projection?vector_name=${encodeURIComponent($('vector').value)}`);clear($('sky'));const xs=data.points.map(p=>p.x),ys=data.points.map(p=>p.y);const minx=Math.min(...xs,0),maxx=Math.max(...xs,0),miny=Math.min(...ys,0),maxy=Math.max(...ys,0);data.points.forEach(p=>{const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');circle.setAttribute('cx',45+810*(p.x-minx)/(maxx-minx||1));circle.setAttribute('cy',30+240*(p.y-miny)/(maxy-miny||1));circle.setAttribute('r',5);circle.setAttribute('fill',p.scene_id===state.selected?'#d46d50':'#a9b9a3');circle.setAttribute('aria-label',`场景 ${p.scene_id}`);circle.onclick=()=>loadScene(p.scene_id);$('sky').append(circle)});$('plot-note').textContent=`${data.points.length} 个入选场景${data.sampled?' · 最多展示前 500 个':''}`}catch(e){$('plot-note').textContent=`投影暂不可用：${e.message}`}}
function routeCard(name,data){const card=node('section',undefined,'route');const heading=node('h2',labels[name]);heading.append(node('span',name==='rrf'?'无权重 RRF':`${data.status||'ok'} · ${data.latency_ms??0} ms`));card.append(heading);if(!data.items?.length){card.append(node('div',data.reason||data.error||'本路没有命中','empty'));return card}data.items.forEach((hit,index)=>{const button=node('button',undefined,'hit');button.append(node('b',`#${index+1} · Scene ${hit.scene_id}`),node('small',name==='rrf'?`RRF ${hit.rrf_score.toFixed(5)} · ${Object.keys(hit.route_ranks).join('、')}`:`原始分数 ${hit.score.toFixed(4)}`),node('small',hit.summary||hit.text_preview||''));button.onclick=()=>loadScene(hit.scene_id,'result-detail');card.append(button)});return card}
async function runSearch(event){event.preventDefault();if(!state.version){status('请先选择有索引版本的书籍',true);return}const query=$('query').value.trim();if(!query)return;status('正在解析需求并执行四路检索…');try{const result=await get(`/books/${state.book}/search`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,version:Number(state.version),route_top_n:20,rrf_top_n:20})});state.search=result;$('query-note').textContent=`解析：${result.parsed_query.summary_query||'沿用原始需求'} · ${result.parsed_query.fallback?'已降级为原始需求':'结构化查询'}${result.parsed_query.cache_hit?' · 命中缓存':''} · ${result.latency_ms} ms`;clear($('routes'));for(const name of ['text_dense','meta_dense','summary_dense','text_sparse'])$('routes').append(routeCard(name,result.routes[name]));$('routes').append(routeCard('rrf',result.rrf));$('result-detail').classList.add('hidden');status(`检索完成 · v${result.version} · ${result.rrf.items.length} 条融合结果`)}catch(e){status(e.message,true)}}
$('book').onchange=async()=>{state.book=Number($('book').value);await loadVersions()};$('version').onchange=async()=>{state.version=Number($('version').value);state.offset=0;await loadObserve()};$('filter').onchange=()=>{state.offset=0;loadScenes()};$('prev').onclick=()=>{state.offset=Math.max(0,state.offset-50);loadScenes()};$('next').onclick=()=>{state.offset+=50;loadScenes()};$('vector').onchange=loadProjection;$('search-form').onsubmit=runSearch;
for(const name of ['observe','search'])$('tab-'+name).onclick=()=>{for(const tab of ['observe','search']){$('tab-'+tab).classList.toggle('active',tab===name);$(tab).classList.toggle('hidden',tab!==name)}};
loadBooks();
</script>
</body></html>
