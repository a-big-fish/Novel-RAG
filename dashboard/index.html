<html lang="zh-CN">
<head>

<title>笔阵 · 范本观察台</title>
<style>
  :root{--paper:#f7f6f2;--white:#fcfbf8;--ink:#25231f;--quiet:#777168;--line:#ded9cf;--red:#ab432f;--green:#557459;--serif:"Noto Serif SC","Source Han Serif SC",SimSun,serif;--sans:"Microsoft YaHei","Segoe UI",sans-serif}

  main{max-width:1440px;margin:auto;padding:0 36px 70px}.nav{display:flex;gap:28px;border-bottom:1px solid var(--line)}.nav button{padding:16px 0 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--quiet)}.nav button.active{color:var(--red);border-color:var(--red);font-weight:700}.status{min-height:34px;color:var(--quiet);font-size:13px;padding:9px 0}.status.error{color:var(--red)}h1{font:700 clamp(24px,3vw,36px) var(--serif);margin:20px 0 6px}h2{font:700 19px var(--serif);margin:0}.lead{color:var(--quiet);margin:0 0 22px}.summary{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);margin:18px 0 26px}.metric{padding:15px 18px;background:var(--white);border-right:1px solid var(--line)}.metric:last-child{border:0}.metric b{display:block;font:700 25px var(--serif)}.metric span{font-size:12px;color:var(--quiet)}
  .work{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;border:1px solid var(--line);background:var(--white);min-height:530px}.panel{padding:18px;min-width:0}.panel+.panel{border-left:1px solid var(--line)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.small{font-size:12px;color:var(--quiet)}.scene-list{max-height:600px;overflow:auto}.scene{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 5px}.scene:hover,.scene.active{background:#f2eee8}.scene strong{display:block;font:700 15px var(--serif)}.scene small{color:var(--quiet)}.pill{display:inline-block;color:var(--green);font-size:11px;border:1px solid #b9c7b8;border-radius:20px;padding:0 7px;margin-left:7px}.pill.archived{color:var(--quiet);border-color:var(--line)}.pill.failed{color:var(--red);border-color:#d7a69b}.controls{display:flex;align-items:center;gap:8px;margin:12px 0}.controls button,.plain{border:1px solid var(--line);background:white;padding:5px 10px}.controls button:disabled{opacity:.4;cursor:default}.scene-text{font:16px/2.05 var(--serif);white-space:pre-wrap;max-width:68ch}.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.detail-meta b{display:block;font-size:12px;color:var(--red);font-weight:500}.detail-meta span{font-size:14px}.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin:3px 4px 3px 0;font-size:12px}.side-block{margin-bottom:24px}.side-block h3{font:700 15px var(--serif);margin:0 0 9px}.side-block p{margin:4px 0;color:var(--quiet);font-size:13px}.tally{display:grid;gap:6px}.tally div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px}.tally span:last-child{color:var(--quiet)}.plot{margin-top:26px;border:1px solid var(--line);background:#292722;color:#eee;padding:20px}.plot h2{color:#fff}.plot-head{display:flex;justify-content:space-between;gap:15px}.plot select{background:#292722;color:white;border:1px solid #6d675d;padding:5px}.plot svg{width:100%;height:300px;margin-top:12px}.plot circle{cursor:pointer}.plot circle:hover{stroke:#fff;stroke-width:3}
  .search-form{display:flex;gap:10px;margin:18px 0 8px}.search-form textarea{flex:1;min-height:82px;resize:vertical;border:1px solid var(--line);background:var(--white);padding:12px}.primary{background:var(--red);color:white;border:0;padding:0 28px;font-weight:700}.query-note{font-size:13px;color:var(--quiet);margin:14px 0 20px}.query-note b{color:var(--ink)}.routes{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto}.route{background:var(--white);border:1px solid var(--line);min-width:170px}.route h2{font:700 15px var(--serif);padding:14px;border-bottom:1px solid var(--line)}.route h2 span{display:block;color:var(--quiet);font:11px var(--sans)}.hit{display:block;background:none;border:0;border-bottom:1px solid var(--line);padding:12px;width:100%;text-align:left}.hit:hover{background:#f1ede6}.hit b{font:700 14px var(--serif)}.hit small{display:block;color:var(--quiet);margin-top:4px}.empty{padding:16px;color:var(--quiet);font-size:13px}.result-detail{margin-top:22px;border:1px solid var(--line);padding:20px;background:var(--white)}.hidden{display:none!important}
  .scene-data{display:grid;gap:20px;margin:16px 0 24px}.data-section{border-top:1px solid var(--line);padding-top:14px}.data-section h3{font:700 16px var(--serif);margin:0 0 10px}.data-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}.data-field{min-width:0}.data-field b{display:block;color:var(--red);font-size:12px;font-weight:500}.data-field span{display:block;overflow-wrap:anywhere;white-space:pre-wrap}.data-field.wide{grid-column:1/-1}.data-tags{display:flex;flex-wrap:wrap;gap:4px}.data-tags .tag{margin:2px 4px 2px 0}.raw-json{border-top:1px solid var(--line);padding-top:14px}.raw-json summary{cursor:pointer;color:var(--red);font-weight:700}.raw-json pre,.data-json{max-height:420px;overflow:auto;border:1px solid var(--line);background:#f4f1eb;padding:12px;font:12px/1.6 Consolas,"Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere}.scene-original h3{font:700 16px var(--serif);margin:0 0 10px}
  .search-scope{display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;margin:20px 0 8px}.search-scope label{display:flex;align-items:center;gap:8px;font-weight:700}.search-scope select{border:1px solid var(--line);background:var(--white);padding:7px 30px 7px 10px}.book-picker{display:flex;flex-wrap:wrap;gap:8px}.book-choice{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--white);border:1px solid var(--line);font-size:13px}.book-choice input{accent-color:var(--red)}.search-progress{border:1px solid var(--line);background:var(--white);margin:18px 0 24px;padding:15px 18px}.progress-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.progress-head strong{font:700 17px var(--serif)}.progress-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.progress-step{padding:3px 9px;border:1px solid var(--line);color:var(--quiet);font-size:12px}.progress-step.current{border-color:var(--red);color:var(--red);background:#fbf0eb}.progress-step.done{color:var(--green);border-color:#b9c7b8}.live-books{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.live-book{border-left:3px solid var(--book-color);padding:3px 9px;background:#f4f1eb;font-size:12px}.aggregate-layout{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2fr);gap:18px;margin-top:20px}.book-lane,.global-list{border:1px solid var(--line);background:var(--white);min-width:0}.aggregate-head{padding:14px 18px;border-bottom:1px solid var(--line)}.aggregate-head h2{font:700 19px var(--serif)}.aggregate-head p{font-size:12px;color:var(--quiet);margin:3px 0 0}.book-lane-item{padding:13px 18px;border-bottom:1px solid var(--line);border-left:4px solid var(--book-color)}.book-lane-item:last-child{border-bottom:0}.book-lane-item b{font:700 15px var(--serif)}.book-lane-item small{display:block;color:var(--quiet)}.book-lane-item details{margin-top:8px}.book-lane-item summary{cursor:pointer;color:var(--red);font-size:12px}.book-routes{margin-top:10px}.book-routes .routes{grid-template-columns:repeat(5,180px)}.global-hit{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 18px}.global-hit:hover{background:#f3eee7}.global-rank{font:700 23px var(--serif);color:var(--red)}.global-hit-body{border-left:3px solid var(--book-color);padding-left:12px;min-width:0}.global-hit-body b{display:block;font:700 15px var(--serif)}.global-hit-body small{display:block;color:var(--quiet)}.global-hit-body span{display:block;margin-top:5px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.route-status{font-size:12px;color:var(--quiet);margin-top:5px}.primary:disabled{opacity:.6;cursor:wait}
  .progress-rail{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.progress-phase{padding:3px 9px;border:1px solid var(--line);color:var(--quiet);font-size:12px}.progress-phase.current{border-color:var(--red);color:var(--red);background:#fbf0eb}.progress-phase.done{color:var(--green);border-color:#b9c7b8}.progress-log{margin-top:10px;border-top:1px solid var(--line);padding-top:7px}.progress-log summary{cursor:pointer;color:var(--quiet);font-size:12px}.progress-steps{margin-top:8px}.progress-step{padding:2px 7px}.progress-steps .progress-step:last-child{color:var(--ink)}
  button.progress-phase{background:transparent;cursor:pointer;font:12px var(--sans)}button.progress-phase:hover,button.progress-phase.selected{border-color:var(--red);color:var(--red);background:#fbf0eb}.progress-detail{margin-top:12px;padding:12px 14px;border:1px solid var(--line);background:#f7f4ed}.progress-detail-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.progress-detail h3{font:700 15px var(--serif);margin:0}.progress-detail p{font-size:13px;margin:8px 0;color:var(--quiet)}.progress-detail pre{max-height:270px;overflow:auto;margin:8px 0 0;padding:10px;background:var(--white);border:1px solid var(--line);font:12px/1.6 Consolas,"Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere}.progress-detail table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.progress-detail th,.progress-detail td{text-align:left;border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:top}.progress-detail th{color:var(--quiet);font-weight:500}.progress-detail td:last-child{overflow-wrap:anywhere}.progress-detail .detail-row{font-size:13px;margin-top:6px}.progress-detail .detail-row b{color:var(--ink)}
  button.progress-phase.failed{border-color:var(--red);color:var(--red)}
  .rerank-board{border:1px solid var(--line);background:var(--white);margin-top:20px}.rerank-head{display:flex;justify-content:space-between;gap:16px;align-items:start;padding:17px 20px;border-bottom:1px solid var(--line)}.rerank-head h2{font:700 23px var(--serif)}.rerank-head p{margin:4px 0 0;color:var(--quiet);font-size:13px}.rerank-count{flex:none;color:var(--red);font:700 28px var(--serif)}.rerank-list{display:grid}.rerank-hit{display:grid;grid-template-columns:56px minmax(0,1fr) 185px;gap:14px;align-items:start;width:100%;padding:14px 20px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line)}.rerank-hit:last-child{border-bottom:0}.rerank-hit:hover{background:#f3eee7}.rerank-position{color:var(--red);font:700 26px var(--serif)}.rerank-main{min-width:0;border-left:3px solid var(--book-color);padding-left:12px}.rerank-main strong{display:block;font:700 16px var(--serif)}.rerank-main small{display:block;color:var(--quiet);font-size:12px}.rerank-main .rerank-preview{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;margin-top:5px;font-size:13px;line-height:1.6}.rerank-evidence{display:grid;gap:5px;justify-items:start;font-size:12px}.rerank-movement{color:var(--quiet)}.rerank-movement.up{color:var(--green)}.rerank-movement.down{color:var(--red)}.rerank-score{font-weight:700}.rerank-score-note{color:var(--quiet);font-size:11px}.score-track{display:block;width:100%;height:4px;background:#e6e0d5}.score-track span{display:block;height:100%;background:var(--green)}.rerank-extra,.pool-details{border-top:1px solid var(--line);padding:0 20px}.rerank-extra summary,.pool-details summary{cursor:pointer;padding:12px 0;color:var(--red);font-size:13px;font-weight:700}.rerank-extra .global-list,.pool-details .global-list{border:0;border-top:1px solid var(--line);margin-bottom:14px}.rerank-extra .global-hit,.pool-details .global-hit{padding-left:4px;padding-right:4px}.rerank-fallback{padding:14px 20px;color:var(--red);font-size:13px;overflow-wrap:anywhere}.aggregate-layout.with-rerank{margin-top:18px}.aggregate-layout.with-rerank .pool-details{border:1px solid var(--line);background:var(--white);padding:0 18px;align-self:start}.aggregate-layout.with-rerank .pool-details .aggregate-head{padding:12px 4px}.rerank-board .empty{padding:20px}
  @media(max-width:900px){.aggregate-layout{grid-template-columns:1fr}.book-lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.book-lane-item{border-bottom:0;border-right:1px solid var(--line)}}
  @media(max-width:1080px){.work{grid-template-columns:240px minmax(0,1fr)}.work .panel:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}@media(max-width:720px){.head{padding:16px;flex-wrap:wrap;gap:8px}.selectors{width:100%;margin-left:0}.selectors .field{flex:1}.field select{width:100%;min-width:0}main{padding:0 16px 50px}.summary{grid-template-columns:repeat(2,1fr)}.metric{border-bottom:1px solid var(--line)}.work{display:block}.panel+.panel{border-left:0;border-top:1px solid var(--line)}.search-form{display:block}.search-form textarea{width:100%}.primary{padding:10px 20px;margin-top:8px}.routes{grid-template-columns:repeat(5,190px)}.data-grid{grid-template-columns:1fr}}
  @media(max-width:720px){.rerank-head{padding:14px}.rerank-count{font-size:23px}.rerank-hit{grid-template-columns:40px minmax(0,1fr);gap:10px;padding:13px 14px}.rerank-position{font-size:20px}.rerank-evidence{grid-column:2;grid-template-columns:1fr 1fr;align-items:center}.score-track{grid-column:1/-1}.rerank-extra,.pool-details{padding:0 14px}}
</style>

<body>
<header><div class="head"><div class="mark">笔</div><div><div class="brand">笔阵 · 范本观察台</div><div class="subtitle">从场景入库到检索命中，逐条看见依据</div></div><div class="selectors"><label class="field">书籍<select id="book"></select></label><label class="field">索引版本<select id="version"></select></label></div></div></header>
<main><nav class="nav"><button id="tab-observe" class="active">索引观察</button><button id="tab-search">检索实验</button></nav><div id="status" class="status" role="status"></div>
<section id="observe"><h1 id="book-title">选择一本书</h1><p class="lead">查看入选场景、归档场景与索引是否一致。</p><div id="summary" class="summary"></div><div class="work"><section class="panel"><div class="panel-head"><h2>场景目录</h2><select id="filter" aria-label="筛选场景"><option value="">全部</option><option value="selected">入选</option><option value="archived">归档</option><option value="evaluation_failed">评估失败</option></select></div><div id="scene-list" class="scene-list"></div><div class="controls"><button id="prev">上一页</button><span id="page" class="small"></span><button id="next">下一页</button></div></section><section class="panel"><div class="panel-head"><h2 id="scene-title">选择一个场景</h2><span id="scene-position" class="small"></span></div><div id="scene-detail" class="small">左侧选定场景后，在这里阅读原文及标注。</div></section><aside class="panel"><div class="side-block"><h3>标签分布</h3><div id="tags" class="tally"></div></div><div class="side-block"><h3>相近场景</h3><div id="similar" class="tally small">选择入选场景后显示</div></div><div class="side-block"><h3>版本对照</h3><div id="compare" class="small">选择另一版本后显示</div></div><div class="side-block"><h3>最近索引阶段</h3><div id="jobs" class="tally small"></div></div></aside></div><div class="plot"><div class="plot-head"><div><h2>向量星图</h2><div class="small">同一书籍、同一版本内的二维投影；坐标不可跨版本比较</div></div><select id="vector"><option value="text-dense">原文向量</option><option value="meta-dense">风格向量</option><option value="summary-dense">摘要向量</option></select></div><svg id="sky" viewBox="0 0 900 300" role="img" aria-label="场景向量二维投影"></svg><div id="plot-note" class="small"></div></div></section>
<section id="search" class="hidden"><h1>检索实验</h1><p class="lead">沿着查询解析、四路召回、书内融合到跨书聚合，查看每一步的结果。</p><div class="search-scope"><label>检索范围<select id="search-mode"><option value="single">当前书籍</option><option value="multi">多书聚合</option></select></label><div id="book-picker" class="book-picker hidden" aria-label="参与聚合的书籍"></div></div><form id="search-form" class="search-form"><textarea id="query" maxlength="2000" placeholder="例如：找一段通过对话逐步揭露真相、结尾有反转的场景" required></textarea><button id="search-submit" class="primary" type="submit">检索范本</button></form><div id="search-progress" class="search-progress hidden" aria-live="polite"><div class="progress-head"><strong id="progress-current">准备检索</strong><span id="progress-meta" class="small"></span></div><div id="progress-rail" class="progress-rail" aria-label="检索阶段"></div><section id="progress-detail" class="progress-detail hidden" aria-live="polite"><div class="progress-detail-head"><h3 id="progress-detail-title"></h3><span id="progress-detail-time" class="small"></span></div><div id="progress-detail-body"></div></section><div id="live-books" class="live-books"></div><details id="progress-log" class="progress-log"><summary>查看详细事件（<span id="progress-count">0</span>）</summary><div id="progress-steps" class="progress-steps"></div></details></div><div id="query-note" class="query-note">结果只来自当前选定的书籍与版本。</div><div id="result-detail" class="result-detail hidden"></div><div id="routes" class="routes"></div><div id="multi-results" class="hidden"></div></section>
</main>
<script>
const api='/api/v1'; const $=id=>document.getElementById(id);
const state={book:null,version:null,offset:0,total:0,selected:null,search:null,books:[],busy:false};
const labels={text_dense:'原文语义',meta_dense:'风格与技法',summary_dense:'剧情摘要',text_sparse:'原文关键词',rrf:'融合排序'};
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);if(cls)el.className=cls;return el}
function clear(el){el.replaceChildren()}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
async function get(url,options){const response=await fetch(api+url,options);if(!response.ok){let body;try{body=await response.json()}catch{}throw Error(body?.detail||`请求失败 (${response.status})`)}return response.json()}
function scope(){return `/books/${state.book}/versions/${state.version}`}
function metric(label,value){const box=node('div',undefined,'metric');box.append(node('b',value),node('span',label));return box}
async function loadBooks(){try{const books=await get('/books');state.books=books;clear($('book'));books.forEach(book=>{const option=node('option',`${book.title} · #${book.id}`);option.value=book.id;$('book').append(option)});renderBookPicker();if(!books.length){status('尚无书籍。请先通过 API 登记并建立索引。');return}state.book=Number(books[0].id);await loadVersions()}catch(e){status(e.message,true)}}
function renderBookPicker(){clear($('book-picker'));for(const book of state.books.filter(item=>item.current_version>0)){const label=node('label',undefined,'book-choice');const input=node('input');input.type='checkbox';input.value=book.id;input.checked=true;label.append(input,node('span',`${book.title} · #${book.id}`));$('book-picker').append(label)}if(!$('book-picker').children.length)$('book-picker').textContent='暂无可检索的书籍'}
async function loadVersions(){try{const data=await get(`/books/${state.book}/versions`);clear($('version'));data.versions.forEach(item=>{const option=node('option',`v${item.version}${item.version===data.current_version?' · 当前':''}`);option.value=item.version;$('version').append(option)});if(!data.versions.length){status('这本书尚未生成场景版本。');return}state.version=data.current_version||data.versions[0].version;$('version').value=state.version;state.offset=0;await loadObserve()}catch(e){status(e.message,true)}}
async function loadObserve(){if(!state.version)return;status('正在读取实时索引…');state.selected=null;$('filter').value='';$('scene-title').textContent='选择一个场景';$('scene-detail').textContent='左侧选定场景后，在这里阅读原文及标注。';$('similar').textContent='选择入选场景后显示';try{const [overview,page]=await Promise.all([get(scope()+'/overview'),get(scope()+'/scenes?limit=50&offset=0')]);$('book-title').textContent=overview.title;renderOverview(overview);renderPage(page);loadProjection();loadCompare();status(`书籍 #${state.book} · v${state.version} · 数据读取于 ${new Date(overview.generated_at).toLocaleString()}`)}catch(e){status(e.message,true)}}

function resetProgress(ids){state.progressEvents=[];state.selectedPhase=null;$('search-progress').classList.remove('hidden');$('progress-detail').classList.add('hidden');clear($('progress-rail'));clear($('progress-steps'));clear($('live-books'));$('progress-rail').dataset.activeIndex='-1';$('progress-log').open=false;$('progress-count').textContent='0';$('progress-current').textContent='准备检索';$('progress-meta').textContent=`${ids.length} 本书`;for(const [stage,label] of progressPhases){if(ids.length===1&&['checking_books','aggregating','reranking'].includes(stage))continue;const item=node('button',label,'progress-phase');item.type='button';item.dataset.stage=stage;item.onclick=()=>{state.selectedPhase=stage;renderProgressDetail()};$('progress-rail').append(item)}for(const id of ids){const item=node('span',`${bookTitle(id)}：等待检索`,'live-book');item.dataset.bookId=id;item.style.setProperty('--book-color',bookColor(id,ids));$('live-books').append(item)}}

async function readSearchStream(url,payload,onProgress){const response=await fetch(api+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok){let body;try{body=await response.json()}catch{}throw Error(body?.detail||`请求失败 (${response.status})`)}if(!response.body)throw Error('浏览器不支持流式响应');const reader=response.body.getReader();const decoder=new TextDecoder();let pending='';let result;while(true){const {value,done}=await reader.read();pending+=decoder.decode(value||new Uint8Array(),{stream:!done});let newline;while((newline=pending.indexOf('\n'))!==-1){const line=pending.slice(0,newline).trim();pending=pending.slice(newline+1);if(!line)continue;const event=JSON.parse(line);if(event.type==='progress')onProgress(event);else if(event.type==='error')throw Error(event.message);else if(event.type==='result')result=event.data}if(done)break}if(!result)throw Error('检索流未返回结果');return result}

function renderRerankBoard(result,ids){
  const board=node('section',undefined,'rerank-board');
  const head=node('div',undefined,'rerank-head');
  const title=node('div');title.append(node('h2','最终重排结果'));
  const scored=result.final.items.filter(hit=>hit.rerank_score!==undefined);
  const remaining=result.final.items.length-scored.length;
  title.append(node('p',`Ollama ${result.rerank.model} · ${scored.length} 条已评分 · ${remaining} 条沿用聚合顺序 · ${formatDuration(result.rerank.latency_ms)}`));
  title.append(node('p','模型分数为 0–1，仅用于本批已评分候选的相对排序；分数越高越靠前。'));
  if(result.rerank.censored_count)title.append(node('p',`${result.rerank.censored_count} 条为边界分数，yes/no 未同时进入模型返回的候选 token。`));
  head.append(title,node('span',`${scored.length} / ${result.final.items.length}`,'rerank-count'));board.append(head);
  const list=node('div',undefined,'rerank-list');
  for(const [index,hit] of scored.entries()){
    const rank=index+1,oldRank=Number(hit.candidate_rank);
    const movement=oldRank-rank;
    const button=node('button',undefined,'rerank-hit');button.type='button';
    button.style.setProperty('--book-color',bookColor(hit.book_id,ids));
    const main=node('span',undefined,'rerank-main');
    main.append(node('strong',`${bookTitle(hit.book_id)} · 场景 ${hit.scene_index_in_book}`),node('small',`书内 RRF #${hit.book_rrf_rank} · 场景 ID ${hit.scene_id} · v${hit.version}`),node('span',(hit.summary||hit.text_preview||'暂无摘要').slice(0,180),'rerank-preview'));
    const evidence=node('span',undefined,'rerank-evidence');
    evidence.append(node('span',`聚合第 ${oldRank} → 重排第 ${rank}${movement>0?` · ↑${movement}`:movement<0?` · ↓${-movement}`:' · 持平'}`,`rerank-movement ${movement>0?'up':movement<0?'down':''}`));
    evidence.append(node('span',`模型分数 ${Number(hit.rerank_score).toFixed(3)}`,'rerank-score'));
    const track=node('span',undefined,'score-track');const fill=node('span');fill.style.width=`${Math.max(0,Math.min(100,Number(hit.rerank_score)*100))}%`;track.append(fill);evidence.append(track);
    if(hit.rerank_score_exact===false)evidence.append(node('span','边界分数','rerank-score-note'));
    button.append(node('span',`#${rank}`,'rerank-position'),main,evidence);
    button.onclick=()=>loadScene(hit.scene_id,'result-detail',hit.book_id,hit.version);
    list.append(button);
  }
  if(!scored.length)list.append(node('div','模型未返回可展示的评分','empty'));
  board.append(list);
  if(remaining>0){
    const extra=node('details',undefined,'rerank-extra');extra.append(node('summary',`查看其余 ${remaining} 条未评分候选（顺序保持不变）`));
    extra.ontoggle=()=>{if(extra.open&&extra.children.length===1)renderRankList(extra,'其余候选','这些候选未进入模型评分，沿用原聚合顺序。',result.final.items.slice(scored.length),ids,scored.length)};
    board.append(extra);
  }
  return board;
}
function renderMultiSearch(result){
  $('routes').classList.add('hidden');$('multi-results').classList.remove('hidden');clear($('multi-results'));
  const ids=result.book_ids;
  if(result.rerank.status==='ok')$('multi-results').append(renderRerankBoard(result,ids));
  else if(result.rerank.status==='failed'){
    const failed=node('section',undefined,'rerank-board');
    const head=node('div',undefined,'rerank-head');head.append(node('h2','重排未完成'));
    failed.append(head,node('p',`最终结果沿用聚合顺序。原因：${result.rerank.reason}`,'rerank-fallback'));
    $('multi-results').append(failed);
  }
  const layout=node('div',undefined,`aggregate-layout${result.rerank.status==='ok'?' with-rerank':''}`);
  const books=node('section',undefined,'book-lane');const head=node('div',undefined,'aggregate-head');
  head.append(node('h2','各书召回'),node('p','每本书独立执行四路检索和无权重 RRF'));books.append(head);
  const lanes=node('div',undefined,'book-lanes');
  for(const id of ids){
    const data=result.books[String(id)],lane=node('div',undefined,'book-lane-item');
    lane.style.setProperty('--book-color',bookColor(id,ids));
    lane.append(node('b',`${bookTitle(id)} · ${data.status==='ok'?`v${data.version}`:'检索失败'}`),node('small',data.status==='ok'?`书内 RRF ${data.rrf.items.length} 条 · ${formatDuration(data.latency_ms)} · ${data.attempts} 次尝试`:data.error||'无法检索'));
    if(data.status==='ok'){
      lane.append(node('div',Object.entries(data.routes).map(([route,item])=>`${labels[route]} ${item.items.length} 条 · ${formatDuration(item.latency_ms)}${item.status==='ok'?'':`（${item.status}）`}`).join(' · '),'route-status'));
      const details=node('details');details.append(node('summary','查看这本书的四路召回与 RRF'));
      details.ontoggle=()=>{if(!details.open||details.children.length>1)return;const grid=node('div',undefined,'routes book-routes');for(const route of ['text_dense','meta_dense','summary_dense','text_sparse'])grid.append(routeCard(route,data.routes[route],id,data.version));grid.append(routeCard('rrf',data.rrf,id,data.version));details.append(grid)};
      lane.append(details);
    }
    lanes.append(lane);
  }
  books.append(lanes);layout.append(books);
  const pool=node('details',undefined,'pool-details');
  pool.append(node('summary',`查看重排前的跨书候选顺序（${result.aggregation.items.length} 条）`));
  pool.ontoggle=()=>{if(pool.open&&pool.children.length===1)renderRankList(pool,'跨书候选池','按各书 RRF 名次轮流汇集，不直接比较不同书的 RRF 分数。',result.aggregation.items,ids)};
  if(result.rerank.status!=='ok'){
    renderRankList(pool,'跨书候选池','按各书 RRF 名次轮流汇集，不直接比较不同书的 RRF 分数。',result.aggregation.items,ids);
    pool.open=true;
  }
  layout.append(pool);$('multi-results').append(layout);
  const rerankText={ok:'已完成',disabled:'未启用',failed:'失败，沿用聚合顺序',skipped:'无候选'};
  $('query-note').textContent=`解析：${result.parsed_query.summary_query||'沿用原始需求'} · ${result.parsed_query.cache_hit?'命中缓存':'新解析'} · ${ids.length} 本书 · ${formatDuration(result.latency_ms)} · 重排：${rerankText[result.rerank.status]||result.rerank.status}`;
}
async function runSearch(event){event.preventDefault();if(state.busy)return;const mode=$('search-mode').value;const query=$('query').value.trim();if(!query)return;if(mode==='single'&&!state.version){status('请先选择有索引版本的书籍',true);return}const ids=mode==='single'?[state.book]:selectedBookIds();if(mode==='multi'&&ids.length<2){status('多书聚合请至少选择两本已索引的书',true);return}state.busy=true;$('search-submit').disabled=true;resetProgress(ids);clear($('routes'));clear($('multi-results'));$('result-detail').classList.add('hidden');$('query-note').textContent='正在读取检索过程…';status('检索已开始');try{const url=mode==='single'?`/books/${state.book}/search/stream`:'/search/multi/stream';const payload=mode==='single'?{query,version:Number(state.version),route_top_n:20,rrf_top_n:20}:{query,book_ids:ids,per_book_limit:20,global_limit:50};const result=await readSearchStream(url,payload,showProgress);state.search=result;if(mode==='single')renderSingleSearch(result);else renderMultiSearch(result);for(const item of $('progress-rail').children)item.classList.remove('current'),item.classList.add('done');if(mode==='multi'&&['disabled','failed'].includes(result.rerank.status)){$('progress-rail').lastChild.classList.remove('done');$('progress-rail').lastChild.classList.toggle('failed',result.rerank.status==='failed');$('progress-rail').lastChild.textContent=result.rerank.status==='failed'?'重排失败':'重排未启用'}if(mode==='single')for(const item of $('live-books').children)item.textContent=bookTitle(state.book)+'：已完成';$('progress-current').textContent='检索完成';$('progress-meta').textContent=`${formatDuration(result.latency_ms)}`;status(mode==='single'?`检索完成 · ${result.rrf.items.length} 条融合结果`:`聚合完成 · ${result.aggregation.items.length} 条候选 · ${result.degraded_books.length} 本降级`)}catch(e){$('progress-current').textContent=`检索未完成：${e.message}`;status(e.message,true)}finally{state.busy=false;$('search-submit').disabled=false}}
$('book').onchange=async()=>{state.book=Number($('book').value);await loadVersions()};$('version').onchange=async()=>{state.version=Number($('version').value);state.offset=0;await loadObserve()};$('filter').onchange=()=>{state.offset=0;loadScenes()};$('prev').onclick=()=>{state.offset=Math.max(0,state.offset-50);loadScenes()};$('next').onclick=()=>{state.offset+=50;loadScenes()};$('vector').onchange=loadProjection;$('search-mode').onchange=()=>{$('book-picker').classList.toggle('hidden',$('search-mode').value!=='multi');$('query-note').textContent=$('search-mode').value==='multi'?'选中至少两本书，查看书内召回和跨书聚合。':'结果只来自当前选定的书籍与版本。'};$('search-form').onsubmit=runSearch;
for(const name of ['observe','search'])$('tab-'+name).onclick=()=>{for(const tab of ['observe','search']){$('tab-'+tab).classList.toggle('active',tab===name);$(tab).classList.toggle('hidden',tab!==name)}};
loadBooks();
</script>
